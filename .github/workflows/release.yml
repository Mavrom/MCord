name: Release

# main'e kod değişikliği gelince otomatik yayın. Sürüm scripts/nextVersion.mjs
# ile hesaplanır: son etiketin patch'i +1; minor/major için package.json'u
# elle yükselt. Etiketi bu workflow kendisi oluşturur — elle etiket push'lama.
on:
  push:
    branches: [main]
    paths-ignore:
      - "baselines/**"
      - "metrics/**"
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: write

# Yayınlar sırayla — iki koşu aynı sürümü hesaplamasın.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Bu commit zaten yayınlandıysa (yeniden koşu) sürüm boş kalır, yayın atlanır.
      - name: Determine version
        id: version
        run: |
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "HEAD zaten etiketli: $(git tag --points-at HEAD) — atlanıyor"
            exit 0
          fi
          v=$(node scripts/nextVersion.mjs)
          echo "Yayınlanacak sürüm: v$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: windows-latest
    env:
      MCORD_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # VERSION sabiti build'de package.json'dan okunuyor; updater bunu
      # etiketle karşılaştırdığı için ikisi aynı olmalı.
      - name: Set version
        run: |
          npm pkg set version=$env:MCORD_VERSION
          cd scripts/installer
          npm pkg set version=$env:MCORD_VERSION

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # dist/app.asar + dist/app.asar.json (SHA-256 manifesti)
      - name: Build and pack asar
        run: pnpm dist

      - name: Package installer
        working-directory: scripts/installer
        run: pnpm package

      # Code signing sertifikası varsa imzala (plan §12.2, §15).
      # Yoksa adım atlanır; imzasız binary'de antivirüs yanlış pozitifi olabilir.
      - name: Sign installer
        if: ${{ env.SIGN_CERT_BASE64 != '' }}
        env:
          SIGN_CERT_BASE64: ${{ secrets.SIGN_CERT_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String($env:SIGN_CERT_BASE64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", $bytes)
          & signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:SIGN_CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            dist\MCordInstaller.exe
          Remove-Item "$env:RUNNER_TEMP\cert.pfx"

      - name: Compute installer checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\MCordInstaller.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  MCordInstaller.exe" | Out-File -Encoding utf8 dist\SHA256SUMS.txt
          $asar = (Get-FileHash dist\app.asar -Algorithm SHA256).Hash.ToLower()
          "$asar  app.asar" | Out-File -Encoding utf8 -Append dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.MCORD_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/MCordInstaller.exe
            dist/app.asar
            dist/app.asar.json
            dist/SHA256SUMS.txt
